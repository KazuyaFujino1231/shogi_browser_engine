services:
  - type: web
    name: shogi-browser-engine
    runtime: static
    branch: codex/browser-local-analysis
    autoDeployTrigger: "off"
    buildCommand: python3 scripts/prepare.py
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
